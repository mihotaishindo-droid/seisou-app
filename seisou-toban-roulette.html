<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清掃当番ルーレット</title>
<style>
  :root{
    --bg: #F4F7F0;
    --paper: #FFFFFF;
    --ink: #16302B;
    --ink-soft: #4A6359;
    --primary: #2E8B77;
    --primary-dark: #1F6B5A;
    --accent: #FFC93C;
    --accent2: #FF6F59;
    --line: #D8E3DB;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(46,139,119,0.07) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(255,201,60,0.10) 0, transparent 45%);
    font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    padding: 32px 16px 60px;
  }
  .wrap{ max-width: 880px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 28px; }
  .eyebrow{
    display:inline-block;
    font-size: 12px;
    letter-spacing: 0.18em;
    font-weight: 700;
    color: var(--primary-dark);
    background: rgba(46,139,119,0.10);
    border: 1px solid rgba(46,139,119,0.25);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1{
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 8px;
    line-height: 1.3;
  }
  h1 .mark{ color: var(--primary); }
  header p{
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  .panel{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(22,48,43,0.06);
    margin-bottom: 22px;
  }
  .panel h2{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 14px;
    color: var(--primary-dark);
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .panel h2 .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px; height:20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 900;
  }

  .name-grid{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .chip{
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    background: #FBFDFB;
    border: 1.5px solid var(--line);
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .12s ease;
    user-select: none;
  }
  .chip .check{
    display:inline-block;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    margin-right: 8px;
    vertical-align: -3px;
    transition: all .12s ease;
  }
  .chip.on{
    color: var(--primary-dark);
    background: rgba(46,139,119,0.10);
    border-color: var(--primary);
  }
  .chip.on .check{
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: inset 0 0 0 3px #fff;
  }
  .chip:hover{ border-color: var(--primary); }

  .roster-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .roster-actions{ display:flex; gap: 8px; }
  .link-btn{
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 2px;
  }
  .count-badge{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .count-badge b{ color: var(--primary-dark); font-size: 15px; }

  .spin-area{ text-align:center; padding: 6px 0 2px; box-shadow:none; }
  #spinBtn{
    font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none;
    padding: 16px 42px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--primary-dark), 0 14px 24px rgba(31,107,90,0.28);
    letter-spacing: 0.03em;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #spinBtn:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--primary-dark), 0 6px 14px rgba(31,107,90,0.28);
  }
  #spinBtn:disabled{ opacity: 0.6; cursor: not-allowed; }
  #hint{
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-soft);
    min-height: 16px;
  }

  .results{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 14px 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(22,48,43,0.05);
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: 6px;
    background: var(--accent);
  }
  .role{
    flex: 1.4 1 0;
    min-width: 0;
    white-space: nowrap;
    font-size: 19px;
    font-weight: 800;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .reel{
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    border-radius: 10px;
    background: #FBFDFB;
    border: 1.5px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    overflow: hidden;
    padding: 4px 8px;
    text-align: center;
  }
  .reel.spinning{
    color: var(--ink-soft);
    border-style: solid;
  }
  .reel.landed{
    background: rgba(46,139,119,0.08);
    border: 1.5px solid var(--primary);
    color: var(--primary-dark);
    animation: pop .32s ease;
  }
  @keyframes pop{
    0%{ transform: scale(0.9); }
    60%{ transform: scale(1.04); }
    100%{ transform: scale(1); }
  }

  footer{
    text-align:center;
    margin-top: 26px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .reel.landed{ animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">WEEKLY CLEANING DUTY</span>
    <h1>清掃当番<span class="mark">ルーレット</span></h1>
  </header>

  <div class="panel">
    <h2><span class="num">1</span>今週参加するメンバーをタップ</h2>
    <div class="name-grid" id="nameGrid"></div>
    <div class="roster-controls">
      <div class="roster-actions">
        <button class="link-btn" id="allBtn" type="button">全員選択</button>
        <button class="link-btn" id="noneBtn" type="button">全員解除</button>
      </div>
      <span class="count-badge">今週の人数：<b id="countNum">8</b>人</span>
    </div>
  </div>

  <div class="panel spin-area">
    <button id="spinBtn">🎯 ルーレットスタート</button>
    <div id="hint">名前を入れてボタンを押すと、担当が自動で決まります</div>
  </div>

  <div class="panel">
    <h2><span class="num">2</span>今週の担当</h2>
    <div class="results" id="results"></div>
  </div>

  <footer>担当は毎回ランダムに割り当てられます。同じ人が続く週は「もう一回」で再抽選できます。</footer>
</div>

<script>
  // 固定メンバー
  const NAMES = ["美穂","守内","青木","良","大橋","仁美","正和","永井"];

  // 人数ごとの役割セット（7人が基準、8人は北窓を追加。北窓は優先順位が最も低く、人数が減ると最初に外す。人数が減るほど近い作業をまとめる／間引く）
  const ROLE_SETS = {
    8: ["エアコン","掃除機（東）","掃除機（西）","南窓・ドア拭き","カッター・名刺ごみ捨て","ポット・電子レンジ拭き","biz＆机の上拭き","北窓周辺拭き"],
    7: ["エアコン","掃除機（東）","掃除機（西）","南窓・ドア拭き","カッター・名刺ごみ捨て","ポット・電子レンジ拭き","biz＆机の上拭き"],
    6: ["エアコン","掃除機（東・西）","南窓・ドア拭き","カッター・名刺ごみ捨て","ポット・電子レンジ拭き","biz＆机の上拭き"],
    5: ["エアコン","掃除機（東・西）","南窓・ドア拭き","カッター・名刺ごみ捨て","ポット電子レンジ＆biz拭き"],
    4: ["エアコン","掃除機（東・西）","カッター・名刺ごみ捨て","ポット電子レンジ＆biz拭き"],
    3: ["エアコン・掃除機全体","カッター・名刺ごみ捨て","ポット電子レンジ＆biz拭き"],
    2: ["エアコン・掃除機全体","カッター名刺ごみ捨て＆ポット電子レンジ＆biz拭き"],
    1: ["清掃全部（今週はお疲れ様です）"]
  };
  const MAX_PEOPLE = NAMES.length;
  const MIN_PEOPLE = 1;

  const nameGrid = document.getElementById('nameGrid');
  const results = document.getElementById('results');
  const spinBtn = document.getElementById('spinBtn');
  const allBtn = document.getElementById('allBtn');
  const noneBtn = document.getElementById('noneBtn');
  const hint = document.getElementById('hint');
  const countNum = document.getElementById('countNum');

  let spinning = false;

  // チップを生成（初期は全員ON）
  NAMES.forEach(name => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip on';
    chip.dataset.name = name;
    chip.innerHTML = `<span class="check"></span>${name}`;
    chip.addEventListener('click', () => {
      const onCount = nameGrid.querySelectorAll('.chip.on').length;
      // 最後の1人はOFFにできない
      if(chip.classList.contains('on') && onCount <= MIN_PEOPLE) return;
      chip.classList.toggle('on');
      refreshCount();
    });
    nameGrid.appendChild(chip);
  });

  function selectedNames(){
    return [...nameGrid.querySelectorAll('.chip.on')].map(c => c.dataset.name);
  }

  function refreshCount(){
    const count = selectedNames().length;
    countNum.textContent = count;
    buildResultCards(count);
  }

  allBtn.addEventListener('click', () => {
    nameGrid.querySelectorAll('.chip').forEach(c => c.classList.add('on'));
    refreshCount();
  });
  noneBtn.addEventListener('click', () => {
    const chips = [...nameGrid.querySelectorAll('.chip')];
    chips.forEach((c, i) => c.classList.toggle('on', i === 0)); // 最低1人は残す
    refreshCount();
  });

  function currentRoles(count){
    const c = Math.min(MAX_PEOPLE, Math.max(MIN_PEOPLE, count));
    return ROLE_SETS[c];
  }

  function buildResultCards(count){
    const roles = currentRoles(count);
    results.innerHTML = '';
    roles.forEach((role, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="role">${role}</div><div class="reel" id="reel-${i}">—</div>`;
      results.appendChild(card);
    });
    fitRoles();
  }

  // 掃除場所の文字を、折り返さずに収まる最大サイズ(19px以下)に自動調整
  function fitRoles(){
    results.querySelectorAll('.role').forEach(el => {
      el.style.whiteSpace = 'nowrap';
      let size = 19;
      el.style.fontSize = size + 'px';
      while(el.scrollWidth > el.clientWidth && size > 11){
        size -= 1;
        el.style.fontSize = size + 'px';
      }
      // 最小サイズでも収まらない長い名前だけ折り返す
      if(el.scrollWidth > el.clientWidth) el.style.whiteSpace = 'normal';
    });
  }
  window.addEventListener('resize', fitRoles);

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 初期表示
  buildResultCards(NAMES.length);

  spinBtn.addEventListener('click', () => {
    if(spinning) return;
    const names = selectedNames();
    if(names.length < 1){
      hint.textContent = "1人以上選んでください";
      return;
    }
    const roles = currentRoles(names.length);
    const assignment = shuffle(names).slice(0, roles.length);

    spinning = true;
    spinBtn.disabled = true;
    hint.textContent = "抽選中…";
    spinBtn.textContent = "🎲 抽選中…";

    const totalDuration = 1400;
    const staggerStep = 140;

    roles.forEach((_, i) => {
      const reel = document.getElementById(`reel-${i}`);
      reel.classList.remove('landed');
      reel.classList.add('spinning');

      const spinTime = totalDuration + i * staggerStep;
      const flickerInterval = setInterval(() => {
        const randomName = names[Math.floor(Math.random() * names.length)];
        reel.textContent = randomName;
      }, 55);

      setTimeout(() => {
        clearInterval(flickerInterval);
        reel.textContent = assignment[i];
        reel.classList.remove('spinning');
        reel.classList.add('landed');

        if(i === roles.length - 1){
          spinning = false;
          spinBtn.disabled = false;
          spinBtn.textContent = "🎯 もう一回スタート";
          hint.textContent = "今週の担当が決まりました！";
        }
      }, spinTime);
    });
  });
</script>
</body>
</html>
